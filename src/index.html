<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyAnalysis - Terminal Estratégico</title>
    
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.js"></script>
    <script src="libs/lucide.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        
        /* Estilos dos Botões da Sidebar */
        .sidebar-item { transition: all 0.2s ease; border-radius: 12px; margin-bottom: 4px; }
        .sidebar-item.active { background-color: #0f172a; color: #ffffff; }
        .sidebar-item:not(.active):hover { background-color: #f8fafc; color: #1e293b; }
        
        /* NOVA BARRA DE ROLAGEM ELEGANTE PARA A SIDEBAR */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: #cbd5e1; }

        iframe { width: 100%; height: 100%; border: none; }
        span.icon-wrapper { display: inline-flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="h-screen flex">

    <div id="app" class="flex w-full h-full">
        
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col z-10 shadow-sm h-full">
            
            <div class="p-6 pb-4 border-b border-slate-50">
                <h1 class="text-xl font-black text-slate-900 tracking-tighter italic">MyAnalysis <span class="text-indigo-600">.</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Screener & Opções Lab</p>
            </div>

            <nav class="flex-1 overflow-y-auto custom-scrollbar px-4 pt-6 pb-6">
                
                <p class="px-4 text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Mercado</p>
                <button @click="navegar('dashboard')" :class="{active: currentPath === 'dashboard'}" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-500">
                    <span class="icon-wrapper" v-html="getIcon('bar-chart-2', 18)"></span> Visão Geral
                </button>

                <button @click="navegar('fundamentos')" :class="{active: currentPath === 'fundamentos'}" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-500">
                    <span class="icon-wrapper" v-html="getIcon('book-open', 18)"></span> Análise Fundamentalista
                </button>

                <button @click="navegar('tecnica')" :class="{active: currentPath === 'tecnica'}" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-500">
                    <span class="icon-wrapper" v-html="getIcon('activity', 18)"></span> Análise Técnica (Swing)
                </button>

                <p class="px-4 text-xs font-semibold text-slate-400 mt-6 mb-2 uppercase tracking-wider">Derivativos</p>
                <button @click="navegar('opcoes')" :class="{active: currentPath === 'opcoes'}" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-500">
                    <span class="icon-wrapper" v-html="getIcon('function-square', 18)"></span> Laboratório de Opções
                </button>

                <p class="px-4 text-xs font-semibold text-slate-400 mt-6 mb-2 uppercase tracking-wider">Sistema</p>
                <button @click="navegar('configuracoes')" :class="{active: currentPath === 'configuracoes'}" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-500">
                    <span class="icon-wrapper" v-html="getIcon('settings', 18)"></span> Configurações da API
                </button>

            </nav>
        </aside>

        <main class="flex-1 relative bg-slate-50 overflow-hidden">
            <iframe :src="iframeSrc" id="contentFrame" class="w-full h-full"></iframe>
        </main>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const currentPath = ref('dashboard');
                const iframeSrc = ref('dashboard.html');

                // Função de Ícone já corrigida para a nova versão do Lucide
                const getIcon = (name, size = 18) => {
                    try {
                        const iconName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                        if (window.lucide && window.lucide.icons[iconName]) {
                            const svgElement = window.lucide.createElement(window.lucide.icons[iconName]);
                            svgElement.setAttribute('width', size);
                            svgElement.setAttribute('height', size);
                            svgElement.setAttribute('stroke-width', 2.5);
                            return svgElement.outerHTML;
                        }
                        return "";
                    } catch(e) { return ""; }
                };

                const navegar = (pagina) => {
                    currentPath.value = pagina;
                    iframeSrc.value = `${pagina}.html`;
                };

                onMounted(() => {
                    setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 150);
                });

                return { currentPath, iframeSrc, navegar, getIcon };
            }
        }).mount('#app');
    </script>
</body>
</html>
