<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyAnalysis - Terminal Estratégico</title>
    
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.js"></script>
    <script src="libs/lucide.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        
        /* Estilos dos Botões da Sidebar */
        .sidebar-item { transition: all 0.2s ease; border-radius: 12px; margin-bottom: 4px; }
        .sidebar-item.active { background-color: #0f172a; color: #ffffff; }
        .sidebar-item:not(.active):hover { background-color: #f8fafc; color: #1e293b; }
        
        /* NOVA BARRA DE ROLAGEM ELEGANTE PARA A SIDEBAR */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: #cbd5e1; }

        iframe { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body class="flex h-screen w-full">

    <div id="app" class="flex w-full h-full">
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col h-full shadow-sm relative z-10 flex-shrink-0">
            
            <!-- LOGO -->
            <div class="p-6 border-b border-slate-100">
                <h1 class="text-2xl font-black tracking-tighter text-slate-900 flex items-center gap-2">
                    <span class="bg-indigo-600 text-white p-1.5 rounded-lg flex items-center justify-center">
                        <span class="icon-wrapper" v-html="getIcon('line-chart', 20)"></span>
                    </span>
                    MyAnalysis
                </h1>
                <p class="text-[10px] uppercase font-bold text-slate-400 mt-1 tracking-widest">Terminal Estratégico</p>
            </div>

            <!-- MENU DE NAVEGAÇÃO -->
            <nav class="flex-1 p-4 overflow-y-auto custom-scrollbar">
                
                <p class="text-xs font-bold text-slate-400 uppercase mb-3 ml-2 tracking-wider">Visão Geral</p>
                <button @click="navegar('dashboard')" :class="['w-full flex items-center gap-3 px-4 py-3 text-sm font-bold sidebar-item', currentPath === 'dashboard' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('layout-dashboard', 20)"></span>
                    Dashboard
                </button>

                <p class="text-xs font-bold text-slate-400 uppercase mt-6 mb-3 ml-2 tracking-wider">Módulos de Análise</p>
                
                <button @click="navegar('fundamentos')" :class="['w-full flex items-center gap-3 px-4 py-3 text-sm font-bold sidebar-item', currentPath === 'fundamentos' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('building-2', 20)"></span>
                    Fundamentos
                </button>

                <button @click="navegar('tecnica')" :class="['w-full flex items-center gap-3 px-4 py-3 text-sm font-bold sidebar-item', currentPath === 'tecnica' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('candlestick-chart', 20)"></span>
                    Análise Técnica
                </button>

                <button @click="navegar('opcoes')" :class="['w-full flex items-center gap-3 px-4 py-3 text-sm font-bold sidebar-item', currentPath === 'opcoes' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('function-square', 20)"></span>
                    Lab de Opções
                </button>

                <!-- NOVO MÓDULO: SIMULADOR -->
                <p class="text-xs font-bold text-slate-400 uppercase mt-6 mb-3 ml-2 tracking-wider">Treinamento</p>
                <button @click="navegar('simulador')" :class="['w-full flex items-center gap-3 px-4 py-3 text-sm font-bold sidebar-item text-left', currentPath === 'simulador' ? 'active bg-emerald-600 text-white' : 'text-emerald-600 hover:bg-emerald-50']">
                    <span class="icon-wrapper" v-html="getIcon('gamepad-2', 20)"></span>
                    Mesa de Operações
                </button>

            </nav>

            <!-- CONFIGURAÇÕES (RODAPÉ DA SIDEBAR) -->
            <div class="p-4 border-t border-slate-100 bg-slate-50">
                <button @click="navegar('configuracoes')" :class="['w-full flex items-center gap-3 px-4 py-3 text-sm font-bold sidebar-item', currentPath === 'configuracoes' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('settings', 20)"></span>
                    Configurações
                </button>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL (IFRAME) -->
        <main class="flex-1 h-full bg-[#f8fafc] relative">
            <iframe :src="iframeSrc" title="Conteúdo Principal"></iframe>
        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const currentPath = ref('dashboard');
                const iframeSrc = ref('dashboard.html');

                const getIcon = (name, size = 18) => {
                    try {
                        const iconName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                        if (window.lucide && window.lucide.icons[iconName]) {
                            const svgElement = window.lucide.createElement(window.lucide.icons[iconName]);
                            svgElement.setAttribute('width', size);
                            svgElement.setAttribute('height', size);
                            svgElement.setAttribute('stroke-width', 2.5);
                            return svgElement.outerHTML;
                        }
                        return "";
                    } catch(e) { return ""; }
                };

                const navegar = (pagina) => {
                    currentPath.value = pagina;
                    iframeSrc.value = `${pagina}.html`;
                };

                onMounted(() => {
                    setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 150);
                });

                return { currentPath, iframeSrc, navegar, getIcon };
            }
        }).mount('#app');
    </script>
</body>
</html>
